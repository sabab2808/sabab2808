<svg viewBox="0 0 520 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Primary languages and tools distribution chart">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65E8FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="segGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <style>
    .donut { animation: spin 50s linear infinite; transform-origin: 130px 150px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: 130px 150px; }
    @keyframes pulse { 0%,100% { opacity:0.5; } 50% { opacity:0.85; } }
    @media (prefers-reduced-motion: reduce) { .donut, .pulse { animation:none !important; } }
  </style>

  <rect x="1" y="1" width="518" height="338" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2"/>

  <text x="24" y="34" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#E5E7EB">PRIMARY STACK</text>
  <text x="24" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5C7A94">By project footprint</text>

