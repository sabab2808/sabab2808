<svg viewBox="0 0 1500 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Primary languages and tools, by project footprint">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65E8FF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="12%" stop-color="#65E8FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="88%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1D33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65E8FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

  </defs>
  <style>
    /* bars are visible by default (static width attribute) — this animation is a
       cosmetic grow-in only, and never the thing that makes them visible. */
    .bar { animation: growBar 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity:0.18; } 50% { opacity:0.4; } }
    @media (prefers-reduced-motion: reduce) { .bar, .shine { animation:none !important; } }
  </style>

  <rect x="1" y="1" width="1498" height="298" rx="20" fill="url(#panelFill)" stroke="url(#panelBorder)" stroke-width="1.3"/>
  <circle class="shine" cx="1380" cy="60" r="140" fill="url(#badgeGlow)" filter="url(#glowStrong)"/>

  <text x="40" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#7D93A6">PRIMARY STACK</text>
  <text x="40" y="70" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="800" fill="url(#titleGrad)">Languages &amp; Tools, by project footprint</text>

  
      <g>
        <text x="40" y="105.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#E5E7EB">JavaScript</text>
        <rect x="230" y="90" width="1120" height="22" rx="11.0" fill="#0C1D33"/>
        <rect x="230" y="90" width="1120.0" height="22" rx="11.0" fill="#F2CB5C" class="bar"
              style="transform-origin:230px 101.0px; animation-delay:0.15s;"/>
        <text x="1368" y="105.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#F2CB5C">30%</text>
      </g>
      <g>
        <text x="40" y="141.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#E5E7EB">TypeScript</text>
        <rect x="230" y="126" width="1120" height="22" rx="11.0" fill="#0C1D33"/>
        <rect x="230" y="126" width="672.0" height="22" rx="11.0" fill="#5B9CF6" class="bar"
              style="transform-origin:230px 137.0px; animation-delay:0.25s;"/>
        <text x="1368" y="141.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#5B9CF6">18%</text>
      </g>
      <g>
        <text x="40" y="177.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#E5E7EB">PHP</text>
        <rect x="230" y="162" width="1120" height="22" rx="11.0" fill="#0C1D33"/>
        <rect x="230" y="162" width="597.3" height="22" rx="11.0" fill="#9C8CF0" class="bar"
              style="transform-origin:230px 173.0px; animation-delay:0.35s;"/>
        <text x="1368" y="177.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#9C8CF0">16%</text>
      </g>
      <g>
        <text x="40" y="213.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#E5E7EB">C++</text>
        <rect x="230" y="198" width="1120" height="22" rx="11.0" fill="#0C1D33"/>
        <rect x="230" y="198" width="522.7" height="22" rx="11.0" fill="#EF4444" class="bar"
              style="transform-origin:230px 209.0px; animation-delay:0.45s;"/>
        <text x="1368" y="213.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#EF4444">14%</text>
      </g>
      <g>
        <text x="40" y="249.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#E5E7EB">Python</text>
        <rect x="230" y="234" width="1120" height="22" rx="11.0" fill="#0C1D33"/>
        <rect x="230" y="234" width="448.0" height="22" rx="11.0" fill="#65E8FF" class="bar"
              style="transform-origin:230px 245.0px; animation-delay:0.55s;"/>
        <text x="1368" y="249.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#65E8FF">12%</text>
      </g>
      <g>
        <text x="40" y="285.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#E5E7EB">HTML / CSS</text>
        <rect x="230" y="270" width="1120" height="22" rx="11.0" fill="#0C1D33"/>
        <rect x="230" y="270" width="373.3" height="22" rx="11.0" fill="#00C8FF" class="bar"
              style="transform-origin:230px 281.0px; animation-delay:0.65s;"/>
        <text x="1368" y="285.8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#00C8FF">10%</text>
      </g>
</svg>
