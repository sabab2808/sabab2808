<svg viewBox="0 0 900 448" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About me summary panel">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65E8FF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="12%" stop-color="#65E8FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="88%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1D33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65E8FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

  </defs>
  <style>
    .row { animation: rowIn 0.7s ease-out; }
    @keyframes rowIn { from { opacity:0; transform: translateX(-10px);} to { opacity:1; transform: translateX(0);} }
    .corner { animation: cornerPulse 5s ease-in-out infinite; }
    @keyframes cornerPulse { 0%,100% { opacity:0.25; } 50% { opacity:0.55; } }
    @media (prefers-reduced-motion: reduce) { .row, .corner { animation:none !important; } }
  </style>

  <rect x="1" y="1" width="898" height="446" rx="20" fill="url(#panelFill)" stroke="url(#panelBorder)" stroke-width="1.3"/>
  <circle class="corner" cx="860" cy="40" r="70" fill="url(#badgeGlow)" filter="url(#glowStrong)"/>

  <text x="30" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#7D93A6">QUICK FACTS</text>
  <text x="30" y="64" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="url(#titleGrad)">Sadman, at a glance</text>

  
      <g class="row" style="animation-delay:0.15s">
