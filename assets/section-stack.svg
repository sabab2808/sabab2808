<svg viewBox="0 0 1500 120" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech Stack section header">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65E8FF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="12%" stop-color="#65E8FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="88%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1D33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65E8FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

  </defs>
  <style>
    .badge-glow { animation: bpulse 4s ease-in-out infinite; transform-origin: 60px 52px; }
    @keyframes bpulse { 0%,100% { opacity:0.55; transform:scale(1);} 50% { opacity:0.95; transform:scale(1.08);} }
    .travel { animation: travel 6s linear infinite; }
    @keyframes travel {
      0%   { transform: translateX(0px); opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(1500px); opacity: 0; }
    }
    .fadein { animation: fadein 0.9s ease-out; }
    @keyframes fadein { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
    @media (prefers-reduced-motion: reduce) { .badge-glow, .travel { animation:none !important; } }
  </style>

  <!-- numbered glass badge -->
  <circle class="badge-glow" cx="60" cy="52" r="34" fill="url(#badgeGlow)" filter="url(#glowStrong)"/>
  <circle cx="60" cy="52" r="30" fill="url(#panelFill)" stroke="url(#panelBorder)" stroke-width="1.2"/>
  <text x="60" y="63" text-anchor="middle" font-size="26" font-family="system-ui,'Segoe UI',sans-serif">🛠️</text>

  <!-- title block -->
  <g class="fadein">
    <text x="112" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#65E8FF" opacity="0.85">02</text>
    <text x="112" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="0.5" fill="url(#titleGrad)">Tech Stack</text>
    <text x="112" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" letter-spacing="0.5" fill="#7D93A6">languages, frameworks and tools I build with</text>
  </g>

  <!-- animated accent line -->
  <line x1="0" y1="112" x2="1500" y2="112" stroke="#0C1D33" stroke-width="1.4"/>
  <line x1="0" y1="112" x2="1500" y2="112" stroke="url(#lineGrad)" stroke-width="1.4"/>
  <circle class="travel" cx="0" cy="112" r="3" fill="#FFFFFF" filter="url(#glowSoft)"/>
</svg>
