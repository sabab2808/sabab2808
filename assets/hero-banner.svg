<svg viewBox="0 0 1500 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sadman Al Islam Shabab, Full-Stack Developer, animated dark space banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="45%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#65E8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65E8FF"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="nebulaBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#65E8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blurStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="1498" height="338" rx="26"/>
    </clipPath>
  </defs>

  <style>
    .nebula-a { animation: driftA 22s ease-in-out infinite; transform-origin: 300px 90px; }
    @keyframes driftA {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -20px) scale(1.12); }
    }
    .nebula-b { animation: driftB 26s ease-in-out infinite; transform-origin: 1200px 260px; }
    @keyframes driftB {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 25px) scale(1.15); }
    }
    .ring { animation: ringSpin 40s linear infinite; transform-origin: 750px 170px; }
    @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .comet { animation: fly 14s linear infinite; }
    @keyframes fly {
      0%   { transform: translate(-120px, 40px); opacity: 0; }
      4%   { opacity: 1; }
      35%  { transform: translate(900px, 260px); opacity: 1; }
      42%  { opacity: 0; }
      100% { transform: translate(900px, 260px); opacity: 0; }
    }
    .underline { animation: breathe 5s ease-in-out infinite; transform-origin: 750px 0px; }
    @keyframes breathe {
      0%, 100% { transform: scaleX(1); opacity: 0.7; }
      50% { transform: scaleX(1.15); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nebula-a, .nebula-b, .ring, .comet, .underline, .twinkle { animation: none !important; }
    }
  </style>

  <rect x="0" y="0" width="1500" height="340" rx="26" fill="url(#bgGrad)"/>

  <g clip-path="url(#bannerClip)">
    <!-- drifting nebula glow -->
    <ellipse class="nebula-a" cx="300" cy="90" rx="260" ry="170" fill="url(#nebulaBlue)" filter="url(#blurStrong)"/>
    <ellipse class="nebula-b" cx="1200" cy="260" rx="280" ry="180" fill="url(#nebulaRed)" filter="url(#blurStrong)"/>

    <!-- starfield -->
    <g class="twinkle">
      <circle cx="956.4" cy="18.0" r="0.86" fill="#B7E9FF" opacity="0.71"><animate attributeName="opacity" values="0.71;0.15999999999999992;0.71" dur="3.9s" begin="4.4s" repeatCount="indefinite"/></circle>
